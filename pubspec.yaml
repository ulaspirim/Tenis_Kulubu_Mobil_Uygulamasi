name: tenis_kulubu
description: Tenis Kulübü Mobil Uygulaması
publish_to: 'none'
version: 1.0.0+1

environment:
  # go_router v14 ve güncel Firebase paketleri için en kararlı minimum Dart SDK sürümü
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management (En kararlı ve stabil sürümler)
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Firebase (Birbiriyle %100 uyumlu ve güncel sürümler)
  firebase_core: ^3.10.0
  firebase_auth: ^5.4.1
  cloud_firestore: ^5.6.1
  firebase_messaging: ^15.2.0
  firebase_storage: ^12.4.0

  # UI & Animasyon
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.1.3
  flutter_animate: ^4.5.2
  gap: ^3.0.1

  # Takvim & Tarih
  table_calendar: ^3.1.2
  intl: ^0.20.2

  # Grafik
  fl_chart: ^0.69.0

  # Medya
  image_picker: ^1.1.2

  # Bildirimler (SDK 3.4.0+ uyumlu, Desugar hatası vermeyen stabil sürüm)
  flutter_local_notifications: ^17.2.2

  # Yardımcılar
  dartz: ^0.10.1
  shared_preferences: ^2.3.3
  connectivity_plus: ^6.1.1
  url_launcher: ^6.3.1
  timeago: ^3.7.0
  uuid: ^4.5.1

  # İkonlar & Navigasyon
  flutter_svg: ^2.0.12
  cupertino_icons: ^1.0.8
  go_router: ^14.7.1
  rxdart: ^0.28.0
  easy_localization: ^3.0.7
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.3
  custom_lint: ^0.7.6 
  riverpod_lint: ^2.6.1
  flutter_launcher_icons: ^0.14.2

flutter:
  uses-material-design: true

  # Asset klasörlerinin kök dizinde (lib ile aynı hizada) fiziksel olarak açıldığından emin ol
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/images/logo.png
    - assets/translations/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"  # ikonun yolu
  min_sdk_android: 21